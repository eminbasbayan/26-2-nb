<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ödeme Başarısız</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; }
    .card { border: 1px solid #f5c2c7; background: #fff5f5; padding: 24px; border-radius: 8px; }
    h1 { color: #991b1b; margin-top: 0; }
    #orderId { word-break: break-all; }
    a { color: #991b1b; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Ödeme başarısız</h1>
    <p>Sipariş tamamlanamadı. Tekrar deneyebilirsiniz.</p>
    <p>Sipariş no: <strong id="orderId">-</strong></p>
    <p><a href="/">Ana sayfa</a></p>
  </div>
  <script>
    const orderId = new URLSearchParams(window.location.search).get('orderId') || '-';
    document.getElementById('orderId').textContent = orderId;
  </script>
</body>
</html>
