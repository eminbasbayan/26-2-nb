<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ödeme Başarılı</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; }
    .card { border: 1px solid #d1e7dd; background: #f0fdf4; padding: 24px; border-radius: 8px; }
    h1 { color: #166534; margin-top: 0; }
    #orderId { word-break: break-all; }
    a { color: #166534; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Ödeme başarılı</h1>
    <p>Siparişiniz alındı.</p>
    <p>Sipariş no: <strong id="orderId">-</strong></p>
    <p id="details"></p>
    <p><a href="/">Ana sayfa</a></p>
  </div>
  <script>
    const orderId = new URLSearchParams(window.location.search).get('orderId') || '-';
    document.getElementById('orderId').textContent = orderId;

    if (orderId && orderId !== '-') {
      fetch('/api/payments/' + orderId, { credentials: 'include' })
        .then((res) => (res.ok ? res.json() : null))
        .then((order) => {
          if (!order) return;
          const name = order.product && order.product.name ? order.product.name : '';
          const price = order.price != null ? order.price + ' TL' : '';
          document.getElementById('details').textContent =
            [name, price, order.status].filter(Boolean).join(' — ');
        })
        .catch(() => {});
    }
  </script>
</body>
</html>
