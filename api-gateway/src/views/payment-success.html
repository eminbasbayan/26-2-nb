<!doctype html>
<html lang="tr" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ödeme başarılı</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="grid min-h-full place-items-center bg-slate-950 p-5 text-slate-100">
    <main class="w-full max-w-lg rounded-3xl border border-emerald-400/20 bg-emerald-400/5 p-8 text-center shadow-2xl">
      <div class="mx-auto grid h-16 w-16 place-items-center rounded-2xl bg-emerald-400 text-3xl font-black text-slate-950">✓</div>
      <p class="mt-6 text-xs font-bold uppercase tracking-[.24em] text-emerald-300">İşlem tamamlandı</p>
      <h1 class="mt-3 text-4xl font-black">Ödeme başarılı</h1>
      <p class="mt-4 text-slate-400">Siparişin güvenle alındı.</p>
      <p id="orderId" class="mt-3 font-mono text-xs text-slate-600"></p>
      <a href="/" class="mt-7 inline-block rounded-xl bg-white px-6 py-3 font-black text-slate-950 transition hover:bg-emerald-300">Mağazaya dön</a>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>$('#orderId').text(new URLSearchParams(location.search).get('orderId') || '');</script>
  </body>
</html>
