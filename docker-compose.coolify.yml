services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  user-service:
    build: ./user-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGO_URI: mongodb://mongo:27017/users_db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1w}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:3001/health']
      interval: 5s
      timeout: 3s
      retries: 20

  catalog-service:
    build: ./catalog-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      MONGO_URI: mongodb://mongo:27017/catalog_db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:3002/health']
      interval: 5s
      timeout: 3s
      retries: 20

  order-service:
    build: ./order-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003
      MONGO_URI: mongodb://mongo:27017/orders_db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      USER_SERVICE_URL: http://user-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3002
      IYZICO_API_KEY: ${IYZICO_API_KEY:?IYZICO_API_KEY is required}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY:?IYZICO_SECRET_KEY is required}
      IYZICO_URI: ${IYZICO_URI:-https://sandbox-api.iyzipay.com}
      IYZICO_CALLBACK_URL: ${APP_URL:?APP_URL is required}/api/payments/callback
      IYZICO_FRONTEND_URL: ${APP_URL:?APP_URL is required}
    depends_on:
      mongo:
        condition: service_healthy
      user-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:3003/health']
      interval: 5s
      timeout: 3s
      retries: 20

  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      USER_SERVICE_URL: http://user-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      CORS_ORIGINS: ${APP_URL:?APP_URL is required}
    depends_on:
      user-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:3000/health']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mongo_data:
